<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signal | JJ's IT Services</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #aaa;
            font-family: monospace;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signal {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        audio {
            display: block;
            width: 100%;
            margin: 0 auto;
        }

        .filename {
            margin-top: 18px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="signal">

        <audio controls>
            <source src="look_what_we_got_here.wav" type="audio/wav">
            Your browser does not support audio playback.
        </audio>

        <div class="filename">
            look_what_we_got_here.wav
        </div>

    </div>

</html>
